<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inner Compass — Психологический ИИ-Профиль</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [step, setStep] = React.useState('welcome');
        const [answers, setAnswers] = React.useState({});
        const [currentQ, setCurrentQ] = React.useState(0);
        const [activeTab, setActiveTab] = React.useState('profile');

        const questions = [
          { id: 1, text: "Что для вас сейчас является главным источником внутреннего напряжения?", options: ["Сроки, дедлайны и груз ответственности", "Нарушение личных границ со стороны окружения", "Ощущение тупика и потери ориентиров", "Хроническая прокрастинация и утечка энергии"] },
          { id: 2, text: "Как ваша психика защищается в моменты резкой критики или давления?", options: ["Ухожу в холодную логику и жесткий контроль", "Закрываюсь в коконе и избегаю контактов", "Включаю внутренний саботаж или агрессию", "Долго прокручиваю диалог в голове"] },
          { id: 3, text: "Какое эмоциональное состояние чаще всего сопровождает конец вашего дня?", options: ["Опустошение и глубинная усталость", "Тревога о том, что сделано недостаточно", "Скрытое раздражение на внешние факторы", "Пространственная апатия и безразличие"] },
          { id: 4, text: "Какая бессознательная стратегия помогает вам справляться с хаосом?", options: ["Контролировать каждый микропроцесс", "Залипать в работу, избегая чувств", "Откладывать решения до критической точки", "Искать одобрения или совета извне"] },
          { id: 5, text: "Чего вы подсознательно опасаетесь больше всего?",options: ["Потерять контроль над своей жизнью", "Оказаться некомпетентным или слабым", "Отвержения, одиночества и непонимания", "Потратить время на ненужные цели"] },
          { id: 6, text: "Какой стиль принятия решений для вас наиболее характерен?", options: ["Холодный расчет фактов и рисков", "Интуитивное улавливание импульсов", "Долгие сомнения и поиск идеального варианта", "Опора на чужой успешный опыт"] },
          { id: 7, text: "Какой главный результат вы хотите получить от работы с собой?", options: ["Вернуть баланс и ресурсное состояние", "Обрести жесткие границы и уверенность", "Найти истинные цели без чужого шума", "Избавиться от фоновой тревожности"] }
        ];

        const handleAnswer = (option) => {
          const newAnswers = { ...answers, [currentQ]: option };
          setAnswers(newAnswers);
          if (currentQ < questions.length - 1) {
            setCurrentQ(currentQ + 1);
          } else {
            setStep('analyzing');
            setTimeout(() => {
              setStep('result');
            }, 3500);
          }
        };

        return (
          <div className="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
            
            {/* WELCOME SCREEN */}
            {step === 'welcome' && (
              <div className="max-w-lg w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl text-center shadow-2xl animate-fade-in relative overflow-hidden">
                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div className="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-6 border border-indigo-500/20">
                  AI Психологическая диагностика
                </div>
                <h1 className="text-3xl sm:text-4xl font-bold mb-4 tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Inner Compass</h1>
                <p className="text-slate-400 mb-8 text-sm sm:text-base leading-relaxed">Пройдите глубокий экспресс-опрос из 7 вопросов. Алгоритмы сопоставят ваши паттерны и построят карту скрытых защитных механизмов и зон роста.</p>
                <button onClick={() => setStep('quiz')} className="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 rounded-2xl font-semibold transition shadow-lg shadow-indigo-600/25 text-white tracking-wide">
                  Начать диагностику
                </button>
              </div>
            )}

            {/* QUIZ SCREEN */}
            {step === 'quiz' && (
              <div className="max-w-lg w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl animate-fade-in">
                <div className="flex justify-between items-center mb-6">
                  <span className="text-xs font-semibold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">Вопрос {currentQ + 1} из {questions.length}</span>
                  <span className="text-xs text-slate-500">{Math.round(((currentQ + 1) / questions.length) * 100)}%</span>
                </div>
                <div className="w-full bg-slate-800 h-1.5 rounded-full mb-6 overflow-hidden">
                  <div className="bg-indigo-500 h-full transition-all duration-300" style={{ width: `${((currentQ + 1) / questions.length) * 100}%` }}></div>
                </div>
                <h2 className="text-xl sm:text-2xl font-semibold mb-6 text-slate-100 leading-snug">{questions[currentQ].text}</h2>
                <div className="space-y-3">
                  {questions[currentQ].options.map((opt, idx) => (
                    <button key={idx} onClick={() => handleAnswer(opt)} className="w-full text-left p-4 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 hover:border-indigo-500/50 transition text-sm sm:text-base text-slate-300 hover:text-white flex items-center justify-between group">
                      <span>{opt}</span>
                      <span className="w-5 h-5 rounded-full border border-slate-600 group-hover:border-indigo-400 group-hover:bg-indigo-500/20 flex items-center justify-center transition shrink-0 ml-3"></span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* ANALYZING SCREEN */}
            {step === 'analyzing' && (
              <div className="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-10 rounded-3xl text-center shadow-2xl animate-fade-in">
                <div className="relative w-16 h-16 mx-auto mb-6">
                  <div className="absolute inset-0 border-4 border-indigo-500/20 rounded-full"></div>
                  <div className="absolute inset-0 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <h2 className="text-xl font-semibold mb-2">Обработка паттернов...</h2>
                <p className="text-slate-400 text-sm">Синтезируем ответы, выстраиваем профиль защитных стратегий.</p>
              </div>
            )}

            {/* RESULT SCREEN */}
            {step === 'result' && (
              <div className="max-w-xl w-full bg-slate-900/90 backdrop-blur-xl border border-slate-800/90 p-6 sm:p-8 rounded-3xl shadow-2xl animate-fade-in">
                
                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Ваш психологический профиль</h2>
                    <p className="text-xs text-slate-400 mt-0.5">Сгенерировано нейросетью на основе 7 параметров</p>
                  </div>
                  <span className="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-xs font-semibold">Готово</span>
                </div>

                {/* Tabs */}
                <div className="flex space-x-2 mb-6 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                  <button onClick={() => setActiveTab('profile')} className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'profile' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Портрет и Защиты</button>
                  <button onClick={() => setActiveTab('practices')} className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'practices' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>План практик (PRO)</button>
                </div>

                {activeTab === 'profile' ? (
                  <div className="space-y-4 mb-6">
                    <div className="bg-slate-950/60 border border-slate-800/80 p-4 sm:p-5 rounded-2xl">
                      <div className="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-1">Ведущий защитный механизм</div>
                      <div className="text-base sm:text-lg font-semibold text-white mb-2">Интеллектуализация и Гиперконтроль</div>
                      <p className="text-slate-300 text-sm leading-relaxed">Вы склонны рационализировать эмоции и переводить стресс в ментальный анализ. Это помогает сохранять эффективность, но приводит к истощению скрытых резервов энергии.</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl">
                        <div className="text-xs font-semibold text-amber-400 uppercase mb-1">Главный триггер</div>
                        <p className="text-xs sm:text-sm text-slate-300">Потеря предсказуемости процессов и нарушение личных границ.</p>
                      </div>
                      <div className="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl">
                        <div className="text-xs font-semibold text-cyan-400 uppercase mb-1">Зона роста</div>
                        <p className="text-xs sm:text-sm text-slate-300">Разрешить себе проживать паузы без чувства вины за бездействие.</p>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 mb-6">
                    <div className="bg-indigo-950/30 border border-indigo-800/40 p-4 rounded-2xl">
                      <div className="text-xs text-indigo-300 font-semibold mb-1">Практика #1: Сброс ментального напряжения</div>
                      <p className="text-xs text-slate-300">Техника «Заземление через 5 сенсорных точек» для быстрого выхода из тревожной петли.</p>
                    </div>
                    <div className="bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl opacity-60">
                      <div className="text-xs text-slate-400 font-semibold mb-1">Практика #2 (PRO): Управление границами</div>
                      <p className="text-xs text-slate-500">Доступно после активации подписки.</p>
                    </div>
                  </div>
                )}

                {/* PAYWALL BLOCK */}
                <div className="bg-gradient-to-r from-indigo-950/80 to-slate-900 border border-indigo-500/30 p-5 rounded-2xl mb-6">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider">Безлимитный PRO-доступ</span>
                    <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-md font-medium">3 дня бесплатно</span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-300 mb-3">Получите ежедневный ИИ-коучинг, персональные аудио-практики и глубокие психологические разборы.</p>
                  <div className="text-lg font-bold text-white mb-4">$4.99 <span className="text-xs font-normal text-slate-400">/ неделя после триала</span></div>
                  <button onClick={() => alert('Интеграция платежного шлюза (Stripe / Telegram Payments) в разработке.')} className="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 rounded-xl font-semibold transition shadow-lg shadow-emerald-600/25 text-white text-sm sm:text-base">
                    Активировать PRO и начать практику
                  </button>
                </div>

                <div className="text-center">
                  <button onClick={() => { setStep('welcome'); setCurrentQ(0); setAnswers({}); }} className="text-xs text-slate-500 hover:text-slate-400 transition underline">Пройти диагностику заново</button>
                </div>

              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
