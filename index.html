<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inner Compass — Внутренний Навигатор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-glow { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [step, setStep] = React.useState('welcome');
        const [answers, setAnswers] = React.useState({});
        const [currentQ, setCurrentQ] = React.useState(0);
        const [activeTab, setActiveTab] = React.useState('profile');
        const [microLoading, setMicroLoading] = React.useState(false);

        const questions = [
          { 
            id: 1, 
            tag: "Уровень I: Телесное отражение",
            text: "Когда внешний мир снова требует от тебя слишком многого, где именно в теле мгновенно затягивается этот невидимый узел напряжения?", 
            options: [
              "Грудная клетка словно скована невидимым панцирем, дыхание становится поверхностным", 
              "Тяжесть наваливается на плечи и шею, заставляя сутулиться под грузом ответственности", 
              "В голове возникает плотный туман, мешающий сфокусироваться на важном", 
              "Глухая усталость разливается по всему телу, сигнализируя о выходе за пределы сил"
            ] 
          },
          { 
            id: 2, 
            tag: "Уровень II: Защитные механизмы",
            text: "Какую привычную маску твое подсознание надевает за доли секунды до того, как мир попытается сделать тебе больно?", 
            options: [
              "Холодная, безупречная рациональность — я всё контролирую, эмоции отключены", 
              "Тихое погружение внутрь себя — я исчезаю для внешнего мира, выстраивая стену", 
              "Резкий внутренний протест — лучше напасть первой или хлопнуть дверью, чем проявить слабость", 
              "Бесконечный мысленный диалог в стиле «надо было поступить иначе»"
            ] 
          },
          { 
            id: 3, 
            tag: "Уровень III: Истинные мотивы",
            text: "О чем на самом деле шепчет тебе тишина в те редкие минуты, когда за тобой закрывается дверь спальни?", 
            options: [
              "«Я снова весь день выживал(а), а когда же начнется настоящая жизнь?»",
              "«Сколько еще у меня хватит ресурса терпеть этот бег на месте?»",
              "«Никто вокруг даже не догадывается, как колоссально устала моя душа»",
              "«Я смертельно боюсь остановиться, потому что тогда рухнет всё, на чем всё держится»"
            ] 
          },
          { 
            id: 4, 
            tag: "Уровень IV: Стратегия выживания",
            text: "Какая тайная опора помогает тебе держаться на плаву тогда, когда почва уходит из-под ног?", 
            options: [
              "Ментальное просчитывание каждого шага на три хода вперед", 
              "С головой уходить в чужие задачи и работу, чтобы заглушить собственные крики", 
              "Замирать и ждать в надежде, что буря стихнет сама собой", 
              "Искать внешнюю опору в ком-то сильном, временно забывая о собственном «Я»"
            ] 
          },
          { 
            id: 5, 
            tag: "Уровень V: Ядро сопротивления",
            text: "Чего на самом деле панически боится та часть тебя, которая никогда, даже во сне, не расслабляет плечи?", 
            options: [
              "Ослабить хватку и рухнуть в неконтролируемый хаос", 
              "Оказаться «несоответствующим(ой)» чужим завышенным ожиданиям", 
              "Остаться абсолютно одному/одной в момент глубокой уязвимости", 
              "Понять в конце пути, что потратил(а) жизнь на чужие цели"
            ] 
          },
          { 
            id: 6, 
            tag: "Уровень VI: Точка бифуркации",
            text: "Как ты совершаешь самый сложный выбор, когда логика бессильна, а внутри нет ни единого ориентира?", 
            options: [
              "Отсекаю сердце бритвой разума и выбираю самый безопасный прагматичный путь", 
              "Доверяюсь глубинному внутреннему компасу, даже если все вокруг крутят пальцем у виска", 
              "Мучительно долго сомневаюсь, собирая чужие мнения и теряя драгоценную энергию", 
              "Плыву по течению, позволяя обстоятельствам решать за меня"
            ] 
          },
          { 
            id: 7, 
            tag: "Уровень VII: Ключ к исцелению",
            text: "Если бы твое уставшее тело обрело голос и смогло сказать тебе правду прямо сейчас, какой была бы его главная фраза?", 
            options: [
              "«Пожалуйста, дай мне выдохнуть... просто разреши мне побыть в тишине и никуда не бежать»",
              "«Научись защищать свои личные границы так же яростно, как ты защищаешь чужие интересы»",
              "«Перестань доказывать этому миру свою безупречность, ты уже ценен(а) просто по факту дыхания»",
              "«Позволь себе право на ошибку, на слабость и на то, чтобы быть живым человеком»"
            ] 
          }
        ];

        const handleAnswer = (option) => {
          const newAnswers = { ...answers, [currentQ]: option };
          setAnswers(newAnswers);
          setMicroLoading(true);
          
          setTimeout(() => {
            setMicroLoading(false);
            if (currentQ < questions.length - 1) {
              setCurrentQ(currentQ + 1);
            } else {
              setStep('analyzing');
              setTimeout(() => {
                setStep('result');
              }, 4200);
            }
          }, 350);
        };

        return (
          <div className="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950/60 via-slate-950 to-black relative">
            
            {/* Фоновое динамическое сияние для гипнотического эффекта */}
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none animate-glow"></div>

            {/* WELCOME SCREEN */}
            {step === 'welcome' && (
              <div className="max-w-lg w-full bg-slate-900/90 backdrop-blur-2xl border border-emerald-500/20 p-8 sm:p-10 rounded-3xl text-center shadow-2xl animate-fade-in relative overflow-hidden">
                <div className="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold uppercase tracking-widest mb-6 border border-emerald-500/30 shadow-inner">
                  🌿 Пространство глубокой честности
                </div>
                <h1 className="text-3xl sm:text-4xl font-bold mb-4 tracking-tight bg-gradient-to-r from-white via-slate-100 to-emerald-300 bg-clip-text text-transparent">Inner Compass</h1>
                <p className="text-slate-300 mb-8 text-sm sm:text-base leading-relaxed">
                  Ты зашел сюда не случайно. Этот мини-тест — не анкета и не тест из интернета. Это зеркало, которое бережно подсветит твои скрытые ментальные блоки и покажет, где именно ты теряешь колоссальный запас жизненной энергии. 
                </p>
                <div className="p-4 bg-emerald-950/40 border border-emerald-500/20 rounded-2xl mb-8 text-xs text-emerald-300/90 leading-relaxed">
                  ⚠️ <strong>Важно:</strong> Отвечай не думая головой — выбирай то, что мгновенно откликается в теле. Твое подсознание уже знает все ответы.
                </div>
                <button onClick={() => setStep('quiz')} className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 rounded-2xl font-semibold transition-all duration-300 shadow-xl shadow-emerald-900/40 text-white tracking-wide border border-emerald-400/30 text-base active:scale-[0.99]">
                  Начать диагностику (займет 2 минуты)
                </button>
              </div>
            )}

            {/* QUIZ SCREEN */}
            {step === 'quiz' && (
              <div className={`max-w-xl w-full bg-slate-900/90 backdrop-blur-2xl border border-emerald-500/20 p-6 sm:p-9 rounded-3xl shadow-2xl transition-all duration-300 ${microLoading ? 'opacity-40 scale-[0.99]' : 'opacity-100 scale-100 animate-fade-in'}`}>
                <div className="flex justify-between items-center mb-6">
                  <span className="text-xs font-semibold uppercase tracking-widest text-emerald-400 bg-emerald-500/10 px-3.5 py-1 rounded-full border border-emerald-500/25">
                    {questions[currentQ].tag}
                  </span>
                  <span className="text-xs font-medium text-emerald-400/80">
                    Шаг {currentQ + 1} из {questions.length}
                  </span>
                </div>
                <div className="w-full bg-slate-800/80 h-1.5 rounded-full mb-8 overflow-hidden">
                  <div className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full transition-all duration-500 ease-out" style={{ width: `${((currentQ + 1) / questions.length) * 100}%` }}></div>
                </div>
                <h2 className="text-xl sm:text-2xl font-medium mb-8 text-slate-100 leading-snug">
                  {questions[currentQ].text}
                </h2>
                <div className="space-y-3.5">
                  {questions[currentQ].options.map((opt, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => handleAnswer(opt)} 
                      className="w-full text-left p-4 sm:p-5 rounded-2xl bg-slate-800/40 hover:bg-emerald-950/30 border border-slate-700/40 hover:border-emerald-500/60 transition-all duration-200 text-sm sm:text-base text-slate-300 hover:text-white flex items-start justify-between group shadow-sm hover:shadow-md hover:shadow-emerald-950/50"
                    >
                      <span className="leading-relaxed">{opt}</span>
                      <span className="w-5 h-5 rounded-full border border-slate-600 group-hover:border-emerald-400 group-hover:bg-emerald-500/30 flex items-center justify-center transition shrink-0 ml-3 mt-0.5"></span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* ANALYZING SCREEN */}
            {step === 'analyzing' && (
              <div className="max-w-md w-full bg-slate-900/90 backdrop-blur-2xl border border-emerald-500/20 p-10 rounded-3xl text-center shadow-2xl animate-fade-in">
                <div className="relative w-20 h-20 mx-auto mb-6">
                  <div className="absolute inset-0 border-4 border-emerald-500/20 rounded-full"></div>
                  <div className="absolute inset-0 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <h2 className="text-xl font-medium mb-3 text-emerald-300">Синхронизируем паттерны...</h2>
                <p className="text-slate-400 text-sm leading-relaxed">Сканируем скрытые точки напряжения, сопоставляем телесные отклики и формируем твой персональный ключ доступа к ресурсу.</p>
              </div>
            )}

            {/* RESULT SCREEN */}
            {step === 'result' && (
              <div className="max-w-xl w-full bg-slate-900/95 backdrop-blur-2xl border border-emerald-500/30 p-6 sm:p-9 rounded-3xl shadow-2xl animate-fade-in">
                
                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">Психологический срез готов</h2>
                    <p className="text-xs text-slate-400 mt-0.5">Диагностика на основе глубинного паттерн-анализа</p>
                  </div>
                  <span className="px-3.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold animate-pulse">Личный код: #940-2</span>
                </div>

                {/* Tabs */}
                <div className="flex space-x-2 mb-6 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                  <button onClick={() => setActiveTab('profile')} className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'profile' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'text-slate-400 hover:text-white'}`}>Твой глубокий портрет</button>
                  <button onClick={() => setActiveTab('practices')} className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'practices' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'text-slate-400 hover:text-white'}`}>План исцеления (PRO)</button>
                </div>

                {activeTab === 'profile' ? (
                  <div className="space-y-4 mb-6">
                    <div className="bg-slate-950/70 border border-emerald-500/30 p-5 rounded-2xl shadow-inner">
                      <div className="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1">🌿 Ведущая стратегия выживания</div>
                      <div className="text-base sm:text-lg font-semibold text-white mb-2">Интеллектуальный контроль и гипер-ответственность</div>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        Ты привык(ла) держать удар в одиночку, конвертируя любые переживания в жесткую логику. Твоя психика выстроила надежную броню, но цена этой защиты — хроническое истощение на клеточном уровне. Ты сильный человек, но даже самым мощным маякам необходима перезагрузка.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="bg-slate-950/60 border border-slate-800/60 p-4 rounded-2xl">
                        <div className="text-xs font-semibold text-emerald-300 uppercase mb-1">Скрытый якорь-триггер</div>
                        <p className="text-xs sm:text-sm text-slate-300">Моменты потери контроля над ситуацией и молчаливое нарушение твоих глубоких личных границ.</p>
                      </div>
                      <div className="bg-slate-950/60 border border-slate-800/60 p-4 rounded-2xl">
                        <div className="text-xs font-semibold text-teal-300 uppercase mb-1">Ключевая точка роста</div>
                        <p className="text-xs sm:text-sm text-slate-300">Разрешить себе уязвимость и присвоить законное право на отдых без тяжелого чувства вины.</p>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 mb-6">
                    <div className="bg-emerald-950/40 border border-emerald-800/50 p-4 rounded-2xl">
                      <div className="text-xs text-emerald-300 font-semibold mb-1">Практика #1: Сброс телесного панциря (Аудио 4 мин)</div>
                      <p className="text-xs text-slate-300">Мгновенное заземление, снимающее хронический спазм с плеч и грудной клетки.</p>
                    </div>
                    <div className="bg-slate-950/60 border border-slate-800/60 p-4 rounded-2xl opacity-60">
                      <div className="text-xs text-slate-400 font-semibold mb-1">Практика #2 (PRO): Перенастройка личных границ без чувства вины</div>
                      <p className="text-xs text-slate-500">Откроется сразу после активации персонального доступа.</p>
                    </div>
                  </div>
                )}

                {/* PAYWALL BLOCK (Глубинный триггер нужности) */}
                <div className="bg-gradient-to-r from-emerald-950/90 via-slate-900 to-slate-950 border border-emerald-500/40 p-5 sm:p-6 rounded-2xl mb-6 shadow-xl shadow-emerald-950/60">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-widest">Ты нужен(а) себе в ресурсном состоянии</span>
                    <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-md font-medium border border-emerald-500/30">3 дня бесплатно</span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-300 mb-4 leading-relaxed">
                    Этот тест — лишь вершина айсберга. Получи полный доступ к закрытой системе ежедневных нейро-практик, аудиотреков и глубокой персональной поддержке. Перестань вывозить всё на волевой тяге.
                  </p>
                  <div className="flex items-baseline justify-between mb-4">
                    <div>
                      <span className="text-2xl font-bold text-white">$4.99</span> 
                      <span className="text-xs text-slate-400 ml-1">/ неделя после триала</span>
                    </div>
                    <span className="text-xs text-emerald-400 font-medium">Отмена в 1 клик в любой момент</span>
                  </div>
                  <button onClick={() => alert('Интеграция платежной системы в разработке.')} className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 rounded-xl font-semibold transition shadow-lg shadow-emerald-600/30 text-white text-sm sm:text-base border border-emerald-400/30 tracking-wide active:scale-[0.99]">
                    Вернуть себя себе (Активировать триал)
                  </button>
                </div>

                <div className="text-center">
                  <button onClick={() => { setStep('welcome'); setCurrentQ(0); setAnswers({}); }} className="text-xs text-slate-500 hover:text-emerald-400 transition underline">Пройти диагностику заново</button>
                </div>

              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(getElementById('root')).render(<App />);
    </script>
  </body>
</html>
