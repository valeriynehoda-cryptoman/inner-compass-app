<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Inner Compass — Внутренний Навигатор</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-glow { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [step, setStep] = React.useState('welcome');
        const [answers, setAnswers] = React.useState({});
        const [currentQ, setCurrentQ] = React.useState(0);
        const [activeTab, setActiveTab] = React.useState('profile');
        const [microLoading, setMicroLoading] = React.useState(false);
        const [userResult, setUserResult] = React.useState(null);
        const [aiStepText, setAiStepText] = React.useState('Инициализация нейросети...');

        // Инициализация Telegram Mini App
        React.useEffect(() => {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            // Красим шапку под стиль приложения, если поддерживается
            if (window.Telegram.WebApp.setHeaderColor) {
              window.Telegram.WebApp.setHeaderColor('#020617');
            }
          }
        }, []);

        const questions = [
          { 
            id: 1, 
            tag: "Тело и напряжение",
            text: "Когда внешний мир требует слишком много сил, где именно в теле острее всего чувствуется усталость?", 
            options: [
              "Грудная клетка словно сжата, дыхание становится поверхностным", 
              "Тяжесть концентрируется в плечах и шее, появляется сутулость", 
              "В голове возникает туман, становится трудно сосредоточиться", 
              "Ощущается общая глухая усталость во всем теле"
            ] 
          },
          { 
            id: 2, 
            tag: "Защитная реакция",
            text: "Как организм реагирует на резкое давление или стрессовую ситуацию?", 
            options: [
              "Включается холодный расчет: полное управление эмоциями и жесткий контроль", 
              "Хочется уйти в себя, закрыться от всех и выдержать паузу в одиночестве", 
              "Появляется внутренний протест, резкость или желание защитить свои границы", 
              "Запускается бесконечный мысленный диалог в стиле «как надо было поступить»"
            ] 
          },
          { 
            id: 3, 
            tag: "Вечерняя тишина",
            text: "О чем думается в тишине в конце долгого и тяжелого дня?", 
            options: [
              "«День прошел в режиме выживания, а когда же жить для себя?»",
              "«Сколько еще получится держаться в таком темпе без срыва?»",
              "«Никто вокруг даже не догадывается, как сильно я устал(а) внутри»",
              "«Страшно остановиться, потому что тогда рухнет всё, что держится на мне»"
            ] 
          },
          { 
            id: 4, 
            tag: "Поиск опоры",
            text: "Что помогает держаться на плаву, когда почва уходит из-под ног?", 
            options: [
              "Четкое планирование каждого шага наперед и просчет всех рисков", 
              "С головой уходить в работу или заботу о других, чтобы не чувствовать усталость", 
              "Режим тишины: замереть и переждать, пока буря утихнет сама", 
              "Поиск поддержки у близких людей при отказе от собственных интересов"
            ] 
          },
          { 
            id: 5, 
            tag: "Внутренний барьер",
            text: "Чего больше всего боится та часть тебя, которая не расслабляется даже на отдыхе?", 
            options: [
              "Потерять контроль и столкнуться с полным хаосом вокруг", 
              "Оказаться недостаточно хорошим(ой) для окружающих людей", 
              "Остаться совсем одному/одной в трудный момент", 
              "Понять в конце пути, что силы ушли не на то, что действительно важно"
            ] 
          },
          { 
            id: 6, 
            tag: "Принятие решений",
            text: "Как принимаются самые сложные решения, когда нет четких ориентиров?", 
            options: [
              "Через холодную логику и отказ от эмоциональных переживаний", 
              "Через внутреннее чутье, несмотря на сомнения окружающих", 
              "Через долгие сомнения, сбор чужих мнений и потерю энергии", 
              "Через плыть по течению и доверие внешним обстоятельствам"
            ] 
          },
          { 
            id: 7, 
            tag: "Голос тела",
            text: "Если бы тело могло прямо сейчас сказать, чего оно хочет больше всего, что бы это было?", 
            options: [
              "«Дай мне выдохнуть, побыть в тишине и никуда не бежать»",
              "«Научись защищать свои личные границы без чувства вины»",
              "«Перестань доказывать всем свою ценность — ты уже молодец»",
              "«Разреши себе ошибаться, отдыхать и быть просто живым человеком»"
            ] 
          }
        ];

        const resultsData = [
          {
            title: "Режим максимального контроля",
            desc: "У вас выработалась привычка справляться со всем самостоятельно, превращая любые переживания в жесткий контроль. Это отличная опора, но она забирает колоссальное количество энергии. Ваша нервная система работает на повышенных оборотах.",
            trigger: "Моменты, когда теряется предсказуемость или кто-то нарушает ваши личные границы.",
            transformation: "Разрешить себе иногда отпускать штурвал и делегировать ответственность миру."
          },
          {
            title: "Стремление к уединению и дистанции",
            desc: "В моменты давления включается защитный механизм изоляции. Вы предпочитаете «переваривать» всё внутри, отгораживаясь от внешнего шума. Внешне вы держитесь стабильно, но внутренний ресурс истощается.",
            trigger: "Ситуации, когда вокруг слишком много суеты, требований и социального контакта.",
            transformation: "Научиться экологично говорить «нет» до того, как наступит эмоциональный срыв."
          },
          {
            title: "Накопление сил и режим ожидания",
            desc: "Вы мастерски умеете терпеть, адаптироваться и выжидать подходящий момент, откладывая свои истинные желания на потом. Это спасает в кризис, но заводит в ловушку фоновой усталости и жизни «по кругу».",
            trigger: "Долгая неопределенность и отсутствие четких ориентиров впереди.",
            transformation: "Сместить фокус с ожидания лучших времен на заботу о себе в моменте здесь и сейчас."
          },
          {
            title: "Высокая планка и стремление к идеалу",
            desc: "Вы привыкли двигаться вперед исключительно на силе воли, предъявляя к себе завышенные требования. Любые достижения обесцениваются, а отдых воспринимается как слабость. Системе срочно нужен баланс.",
            trigger: "Страх сделать что-то недостаточно хорошо или столкнуться с осуждением.",
            transformation: "Осознать, что ваша ценность не зависит от продуктивности и безупречности."
          }
        ];

        const handleAnswer = (optionIndex) => {
          const newAnswers = { ...answers, [currentQ]: optionIndex };
          setAnswers(newAnswers);
          setMicroLoading(true);
          
          setTimeout(() => {
            setMicroLoading(false);
            if (currentQ < questions.length - 1) {
              setCurrentQ(currentQ + 1);
            } else {
              // Аналитика ответов
              const counts = [0, 0, 0, 0];
              Object.values(newAnswers).forEach(val => {
                if (val >= 0 && val < 4) counts[val]++;
              });
              const maxIndex = counts.indexOf(Math.max(...counts));
              setUserResult(resultsData[maxIndex]);

              setStep('analyzing');
              
              // Имитация этапов работы ИИ для создания высокой ценности результата
              setTimeout(() => setAiStepText('Анализ паттернов мышечного напряжения...'), 1000);
              setTimeout(() => setAiStepText('Оценка уровня скрытого выгорания...'), 2200);
              setTimeout(() => setAiStepText('Формирование персонального профиля...'), 3300);

              setTimeout(() => {
                setStep('result');
              }, 4500);
            }
          }, 300);
        };

        return (
          <div className="flex flex-col items-center justify-center min-h-screen p-4 sm:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-emerald-950/60 via-slate-950 to-black relative">
            
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none animate-glow"></div>

            {/* WELCOME SCREEN */}
            {step === 'welcome' && (
              <div className="max-w-lg w-full bg-slate-900/90 backdrop-blur-2xl border border-emerald-500/20 p-8 sm:p-10 rounded-3xl text-center shadow-2xl animate-fade-in relative overflow-hidden">
                <div className="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-semibold uppercase tracking-widest mb-6 border border-emerald-500/30 shadow-inner">
                  🌿 Глубокая экспресс-диагностика ресурса
                </div>
                <h1 className="text-3xl sm:text-4xl font-bold mb-4 tracking-tight bg-gradient-to-r from-white via-slate-100 to-emerald-300 bg-clip-text text-transparent">Inner Compass</h1>
                <p className="text-slate-300 mb-8 text-sm sm:text-base leading-relaxed">
                  Узнайте за 2 минуты, куда утекает ваша энергия, почему организм сопротивляется отдыху и как вернуть ресурсное состояние без выгорания.
                </p>
                <div className="p-4 bg-emerald-950/40 border border-emerald-500/20 rounded-2xl mb-8 text-xs text-emerald-300/90 leading-relaxed text-left space-y-1.5">
                  <div>✨ Точный анализ текущего состояния нервной системы</div>
                  <div>🛡️ Без банальных советов и воды</div>
                  <div>🔒 Анонимно и конфиденциально</div>
                </div>
                <button onClick={() => setStep('quiz')} className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 rounded-2xl font-semibold transition-all duration-300 shadow-xl shadow-emerald-900/40 text-white tracking-wide border border-emerald-400/30 text-base active:scale-[0.99]">
                  Начать диагностику (2 мин)
                </button>
              </div>
            )}

            {/* QUIZ SCREEN */}
            {step === 'quiz' && (
              <div className={`max-w-xl w-full bg-slate-900/90 backdrop-blur-2xl border border-emerald-500/20 p-6 sm:p-9 rounded-3xl shadow-2xl transition-all duration-300 ${microLoading ? 'opacity-40 scale-[0.99]' : 'opacity-100 scale-100 animate-fade-in'}`}>
                <div className="flex justify-between items-center mb-6">
                  <span className="text-xs font-semibold uppercase tracking-widest text-emerald-400 bg-emerald-500/10 px-3.5 py-1 rounded-full border border-emerald-500/25">
                    {questions[currentQ].tag}
                  </span>
                  <span className="text-xs font-medium text-emerald-400/80">
                    Вопрос {currentQ + 1} из {questions.length}
                  </span>
                </div>
                <div className="w-full bg-slate-800/80 h-1.5 rounded-full mb-8 overflow-hidden">
                  <div className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full transition-all duration-500 ease-out" style={{ width: `${((currentQ + 1) / questions.length) * 100}%` }}></div>
                </div>
                <h2 className="text-xl sm:text-2xl font-medium mb-8 text-slate-100 leading-snug">
                  {questions[currentQ].text}
                </h2>
                <div className="space-y-3.5">
                  {questions[currentQ].options.map((opt, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => handleAnswer(idx)} 
                      className="w-full text-left p-4 sm:p-5 rounded-2xl bg-slate-800/40 hover:bg-emerald-950/30 border border-slate-700/40 hover:border-emerald-500/60 transition-all duration-200 text-sm sm:text-base text-slate-300 hover:text-white flex items-start justify-between group shadow-sm hover:shadow-md hover:shadow-emerald-950/50"
                    >
                      <span className="leading-relaxed">{opt}</span>
                      <span className="w-5 h-5 rounded-full border border-slate-600 group-hover:border-emerald-400 group-hover:bg-emerald-500/30 flex items-center justify-center transition shrink-0 ml-3 mt-0.5"></span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* ANALYZING SCREEN (AI SIMULATION) */}
            {step === 'analyzing' && (
              <div className="max-w-md w-full bg-slate-900/90 backdrop-blur-2xl border border-emerald-500/20 p-10 rounded-3xl text-center shadow-2xl animate-fade-in">
                <div className="relative w-20 h-20 mx-auto mb-6">
                  <div className="absolute inset-0 border-4 border-emerald-500/20 rounded-full"></div>
                  <div className="absolute inset-0 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <h2 className="text-xl font-medium mb-2 text-emerald-300">ИИ анализирует ответы...</h2>
                <p className="text-slate-400 text-xs sm:text-sm min-h-[2rem] transition-all duration-300">{aiStepText}</p>
              </div>
            )}

            {/* RESULT SCREEN */}
            {step === 'result' && userResult && (
              <div className="max-w-xl w-full bg-slate-900/95 backdrop-blur-2xl border border-emerald-500/30 p-6 sm:p-9 rounded-3xl shadow-2xl animate-fade-in">
                
                <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">Ваш профиль ресурса</h2>
                    <p className="text-xs text-slate-400 mt-0.5">Сгенерировано на основе ваших ответов</p>
                  </div>
                  <span className="px-3.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold">Готово</span>
                </div>

                {/* Tabs */}
                <div className="flex space-x-2 mb-6 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                  <button onClick={() => setActiveTab('profile')} className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'profile' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'text-slate-400 hover:text-white'}`}>Диагноз состояния</button>
                  <button onClick={() => setActiveTab('practices')} className={`flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${activeTab === 'practices' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/40' : 'text-slate-400 hover:text-white'}`}>План восстановления (PRO)</button>
                </div>

                {activeTab === 'profile' ? (
                  <div className="space-y-4 mb-6">
                    <div className="bg-slate-950/70 border border-emerald-500/30 p-5 rounded-2xl shadow-inner">
                      <div className="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-1">🌿 Основной защитный механизм</div>
                      <div className="text-base sm:text-lg font-semibold text-white mb-2">{userResult.title}</div>
                      <p className="text-slate-300 text-sm leading-relaxed">
                        {userResult.desc}
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="bg-slate-950/60 border border-slate-800/60 p-4 rounded-2xl">
                        <div className="text-xs font-semibold text-emerald-300 uppercase mb-1">Главный триггер</div>
                        <p className="text-xs sm:text-sm text-slate-300">{userResult.trigger}</p>
                      </div>
                      <div className="bg-slate-950/60 border border-slate-800/60 p-4 rounded-2xl">
                        <div className="text-xs font-semibold text-teal-300 uppercase mb-1">Вектор трансформации</div>
                        <p className="text-xs sm:text-sm text-slate-300">{userResult.transformation}</p>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 mb-6">
                    <div className="bg-emerald-950/40 border border-emerald-800/50 p-4 rounded-2xl">
                      <div className="text-xs text-emerald-300 font-semibold mb-1">Шаг №1: Техника быстрой разгрузки нервной системы</div>
                      <p className="text-xs text-slate-300">Базовый протокол переключения внимания из режима выживания в ресурс.</p>
                    </div>
                    <div className="bg-slate-950/60 border border-slate-800/60 p-4 rounded-2xl opacity-60">
                      <div className="text-xs text-slate-400 font-semibold mb-1">Шаг №2 (PRO): Протокол защиты личных границ</div>
                      <p className="text-xs text-slate-500">Доступно после активации полного доступа.</p>
                    </div>
                  </div>
                )}

                {/* PAYWALL BLOCK (HIGH CONVERSION) */}
                <div className="bg-gradient-to-r from-emerald-950/90 via-slate-900 to-slate-950 border border-emerald-500/40 p-5 sm:p-6 rounded-2xl mb-6 shadow-xl shadow-emerald-950/60">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-widest">Полный доступ к программе</span>
                    <span className="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-md font-medium border border-emerald-500/30">3 дня бесплатно</span>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-300 mb-4 leading-relaxed">
                    Получите персональный план восстановления сил, ежедневные аудио-техники сброса напряжения и инструменты работы с выгоранием.
                  </p>
                  <div className="flex items-baseline justify-between mb-4">
                    <div>
                      <span className="text-2xl font-bold text-white">$4.99</span> 
                      <span className="text-xs text-slate-400 ml-1">/ неделя после триала</span>
                    </div>
                    <span className="text-xs text-emerald-400 font-medium">Безопасная оплата в Telegram</span>
                  </div>
                  <button onClick={() => {
                    // Интеграция с Telegram Payments / Stars или платежным шлюзом
                    if (window.Telegram && window.Telegram.WebApp) {
                      window.Telegram.WebApp.showAlert('Переход на защищенную оплату...');
                    } else {
                      alert('Переход на оплату подписки.');
                    }
                  }} className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 rounded-xl font-semibold transition shadow-lg shadow-emerald-600/30 text-white text-sm sm:text-base border border-emerald-400/30 tracking-wide active:scale-[0.99]">
                    Активировать доступ (3 дня бесплатно)
                  </button>
                </div>

                <div className="text-center">
                  <button onClick={() => { setStep('welcome'); setCurrentQ(0); setAnswers({}); setUserResult(null); }} className="text-xs text-slate-500 hover:text-emerald-400 transition underline">Пройти диагностику заново</button>
                </div>

              </div>
            )}
          </div>
        );
      }

      document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
